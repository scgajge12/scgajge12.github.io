<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Portfolio OGP (PNG) Generator</title>
<!--
  ポートフォリオ全体の共通 OGP（home.png）を Canvas で描画して
  static/images/og/home.png を書き出すツール。
  scripts/ogp/gen_svg.mjs と同じデザイン。
  ※ 静的ゲームサイト（/games/）は独自 OGP を持つため対象外。

  使い方:
    1) このファイルをブラウザ（Chrome / Edge 推奨）で開く:
         open /Users/yutamorioka/scgajge12/Private/External/scgajge12.github.io/scripts/ogp/gen_png.html
    2) 「Save into static/images/og/」ボタンを押し、リポジトリの
       `static/images/og` フォルダを選択する（File System Access API）
       非対応ブラウザの場合は「Download all」でダウンロード
-->
<style>
  :root {
    --bg: #0b1622;
    --panel: #12283b;
    --text: #e6f4f9;
    --muted: #93c5d8;
    --accent: #38b48b;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif; }
  header { padding: 20px 28px; border-bottom: 1px solid #1f3a52;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; flex: 1 1 auto; }
  button { font: inherit; padding: 10px 16px; border-radius: 8px;
    border: 1px solid #2a4d6c; background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #04111e;
    border-color: var(--accent); font-weight: 700; }
  #log { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    color: var(--muted); margin-left: 12px; }
  main { padding: 24px 28px; display: grid; grid-template-columns: 1fr; gap: 18px; max-width: 760px; }
  .card { background: var(--panel); border-radius: 10px; padding: 12px; }
  .card h2 { margin: 0 0 8px 0; font-size: 12px; color: var(--muted); font-weight: 600; }
  canvas { width: 100%; height: auto; display: block; border-radius: 6px;
    background: #04111e; }
</style>
</head>
<body>
<header>
  <h1>Portfolio OGP (PNG) Generator — 1200×630</h1>
  <button id="saveAll" class="primary">Save into static/images/og/</button>
  <button id="downloadAll">Download</button>
  <span id="log">loading avatar…</span>
</header>
<main id="grid"></main>

<script>
// ============================================================
// ページ定義（gen_svg.mjs と同じ）
// ============================================================
const PAGES = [
  {
    out: "home.png",
    eyebrow: "Portfolio",
    titleLine1: "Yuta Morioka",
    titleLine2: "morioka12",
    subtitle: "Security Engineer and Bug Hunter",
  }
];

// アバター画像（リポジトリの static/images/morioka12.jpg をブラウザの相対パスで参照）
const AVATAR_URL = "../../static/images/morioka12.jpg";

const W = 1200, H = 630;
const ACCENT = "#38b48b";
const ACCENT2 = "#22d3ee";
const FONT_SANS = `-apple-system, "Helvetica Neue", "Hiragino Sans", "Segoe UI", "Yu Gothic UI", "Noto Sans CJK JP", Arial, sans-serif`;
const FONT_MONO = `"SF Mono", "JetBrains Mono", "Menlo", "Consolas", ui-monospace, monospace`;

// アバター座標
const AV_CX = 950;
const AV_CY = H / 2 + 10;
const AV_R  = 168;

function drawOGP(ctx, p, avatarImg) {
  // --- 背景 グラデーション ---
  const lg = ctx.createLinearGradient(0, 0, W, H);
  lg.addColorStop(0, "#08111c");
  lg.addColorStop(0.45, "#0c1a28");
  lg.addColorStop(1, "#102434");
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, W, H);

  // 左下のシアン光彩
  const rg2 = ctx.createRadialGradient(W*0.08, H*0.92, 0, W*0.08, H*0.92, 700);
  rg2.addColorStop(0, "rgba(34,211,238,0.10)");
  rg2.addColorStop(1, "rgba(34,211,238,0)");
  ctx.fillStyle = rg2; ctx.fillRect(0, 0, W, H);

  // ドットグリッド（上が濃く下が薄い）
  for (let y = 0; y < H; y += 22) {
    const alpha = 0.07 * (1 - (y / H) * 0.88);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    for (let x = 0; x < W; x += 22) {
      ctx.beginPath();
      ctx.arc(x, y, 1, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // --- アバター背後の光彩 ---
  const avGlow = ctx.createRadialGradient(AV_CX, AV_CY, 0, AV_CX, AV_CY, AV_R * 2.2);
  avGlow.addColorStop(0, "rgba(56,180,139,0.55)");
  avGlow.addColorStop(0.55, "rgba(56,180,139,0.18)");
  avGlow.addColorStop(1, "rgba(56,180,139,0)");
  ctx.fillStyle = avGlow;
  ctx.beginPath(); ctx.arc(AV_CX, AV_CY, AV_R * 2.2, 0, Math.PI*2); ctx.fill();

  // --- アバター外側の薄い破線リング ---
  ctx.strokeStyle = "rgba(56,180,139,0.30)";
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 6]);
  ctx.beginPath(); ctx.arc(AV_CX, AV_CY, AV_R + 28, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // --- アバター画像（円形クリップ + ドロップシャドウ） ---
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.55)";
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 8;
  ctx.beginPath();
  ctx.arc(AV_CX, AV_CY, AV_R, 0, Math.PI*2);
  ctx.clip();
  ctx.drawImage(avatarImg, AV_CX - AV_R, AV_CY - AV_R, AV_R * 2, AV_R * 2);
  ctx.restore();

  // --- アバター：メインのアクセントリング（グラデ） ---
  const ringGrad = ctx.createLinearGradient(AV_CX - AV_R, AV_CY - AV_R, AV_CX + AV_R, AV_CY + AV_R);
  ringGrad.addColorStop(0, "rgba(56,180,139,0.95)");
  ringGrad.addColorStop(0.5, "rgba(34,211,238,0.95)");
  ringGrad.addColorStop(1, "rgba(56,180,139,0.55)");
  ctx.strokeStyle = ringGrad;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(AV_CX, AV_CY, AV_R + 6, 0, Math.PI*2); ctx.stroke();

  // --- アバター：内側ハイライト ---
  ctx.strokeStyle = "rgba(255,255,255,0.10)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(AV_CX, AV_CY, AV_R - 2, 0, Math.PI*2); ctx.stroke();

  // --- アバター右下：ターミナル風バッジ ">_" ---
  const bx = AV_CX + AV_R - 18, by = AV_CY + AV_R - 18;
  ctx.fillStyle = "#0c1a28";
  ctx.beginPath(); ctx.arc(bx, by, 28, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = ACCENT; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(bx, by, 28, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = ACCENT;
  ctx.font = `800 22px ${FONT_MONO}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(">_", bx - 2, by + 8);
  ctx.textAlign = "left";

  // --- ブランド（左上）● morioka12 ---
  ctx.fillStyle = ACCENT;
  ctx.beginPath(); ctx.arc(64+9, 60+14, 9, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(56,180,139,0.25)"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(64+9, 60+14, 14, 0, Math.PI*2); ctx.stroke();

  ctx.fillStyle = "#e9f6ee";
  ctx.font = `700 22px ${FONT_MONO}`;
  ctx.fillText("morioka12", 64+32, 60+22);

  // ドメイン（右上）
  ctx.fillStyle = "rgba(214,241,227,0.6)";
  ctx.font = `400 18px ${FONT_MONO}`;
  ctx.textAlign = "right";
  ctx.fillText("scgajge12.github.io", W-64, 82);
  ctx.textAlign = "left";

  // --- Eyebrow ピル "// PORTFOLIO" ---
  const eyebrowText = `// ${p.eyebrow.toUpperCase()}`;
  const ebFs = 17;
  const ebLs = 0.22;
  const ebPadX = 16;
  ctx.font = `700 ${ebFs}px ${FONT_MONO}`;
  const ewBase = ctx.measureText(eyebrowText).width;
  const ewExtra = eyebrowText.length * ebFs * ebLs;
  const eyebrowW = Math.ceil(ewBase + ewExtra + ebPadX * 2);
  ctx.fillStyle = "rgba(56,180,139,0.10)";
  roundRect(ctx, 64, 156, eyebrowW, 34, 6);
  ctx.fill();
  ctx.strokeStyle = "rgba(56,180,139,0.45)"; ctx.lineWidth = 1;
  roundRect(ctx, 64, 156, eyebrowW, 34, 6); ctx.stroke();
  ctx.fillStyle = ACCENT;
  drawLetterSpaced(ctx, eyebrowText, 64 + ebPadX, 156 + 23, ebLs);

  // --- タイトル（2 行スタック）---
  const titleFs = 92;
  const titleY1 = 156 + 34 + 30 + titleFs * 0.78;       // ≒ 292
  const titleY2 = titleY1 + titleFs * 1.02;             // ≒ 386
  ctx.font = `900 ${titleFs}px ${FONT_SANS}`;
  ctx.fillStyle = "#ffffff";
  ctx.fillText(p.titleLine1, 64, titleY1);
  ctx.fillStyle = ACCENT;
  ctx.fillText(p.titleLine2, 64, titleY2);

  // --- サブタイトル ---
  const subY = titleY2 + 50;
  ctx.fillStyle = "rgba(214,241,227,0.78)";
  ctx.font = `500 26px ${FONT_SANS}`;
  ctx.fillText(p.subtitle, 64, subY);

  // --- 下部発光ライン ---
  const ug = ctx.createLinearGradient(0, 0, W, 0);
  ug.addColorStop(0, "rgba(56,180,139,0)");
  ug.addColorStop(0.22, "rgba(56,180,139,0.85)");
  ug.addColorStop(0.52, "rgba(34,211,238,0.85)");
  ug.addColorStop(0.82, "rgba(56,180,139,0.85)");
  ug.addColorStop(1, "rgba(56,180,139,0)");
  ctx.fillStyle = ug;
  ctx.fillRect(0, H-6, W, 6);
  ctx.globalAlpha = 0.5;
  ctx.fillRect(0, H-10, W, 4);
  ctx.globalAlpha = 1;
}

// ===== ユーティリティ =====
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
function drawLetterSpaced(ctx, str, x, y, em) {
  const baseSize = parseInt(ctx.font, 10) || 17;
  const extra = baseSize * em;
  let cx = x;
  for (const ch of str) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + extra;
  }
}
function loadImage(url) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => res(img);
    img.onerror = (e) => rej(new Error(`failed to load ${url}: ${e?.message || e}`));
    img.src = url;
  });
}

// ===== レンダリング =====
const grid = document.getElementById("grid");
const canvases = new Map();
const log = document.getElementById("log");
function setLog(msg) { log.textContent = msg; }

(async function init() {
  let avatarImg;
  try {
    avatarImg = await loadImage(AVATAR_URL);
  } catch (e) {
    setLog(`avatar load failed: ${e.message}. ファイルを file:// で開いている場合は CORS で失敗するため、リポジトリルートで簡易サーバを立ててから http://… 経由でこのファイルを開いてください。`);
    return;
  }
  for (const p of PAGES) {
    const card = document.createElement("div");
    card.className = "card";
    const h2 = document.createElement("h2");
    h2.textContent = p.out;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    card.appendChild(h2);
    card.appendChild(c);
    grid.appendChild(card);
    canvases.set(p.out, c);
    drawOGP(c.getContext("2d"), p, avatarImg);
  }
  setLog("ready. Save または Download を押してください。");
})();

// ===== 保存 =====
async function blobFor(canvas) {
  return new Promise((res) => canvas.toBlob((b) => res(b), "image/png"));
}

document.getElementById("downloadAll").onclick = async () => {
  for (const p of PAGES) {
    const blob = await blobFor(canvases.get(p.out));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = p.out;
    a.click();
    await new Promise((r) => setTimeout(r, 150));
  }
  setLog("downloaded");
};

document.getElementById("saveAll").onclick = async () => {
  if (!window.showDirectoryPicker) {
    setLog("File System Access API unsupported. Use Download instead.");
    return;
  }
  try {
    const dir = await window.showDirectoryPicker({ mode: "readwrite" });
    for (const p of PAGES) {
      const blob = await blobFor(canvases.get(p.out));
      const fh = await dir.getFileHandle(p.out, { create: true });
      const ws = await fh.createWritable();
      await ws.write(blob);
      await ws.close();
      setLog(`saved ${p.out}`);
    }
    setLog("Done. PNG saved.");
  } catch (e) {
    setLog(`error: ${e.message}`);
  }
};
</script>
</body>
</html>
